# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD — E-Bot (GitLab = źródło prawdy).
#
# Wierny port dawnego .github/workflows/ci.yml (GitHub Actions niedostępne) +
# skan bezpieczeństwa GitLab (SAST · Secret Detection) + publikacja dokumentacji
# (MkDocs Material → GitLab Pages).
#
# Etapy: sync → quality → test → deploy
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - sync
  - quality
  - test
  - release
  - deploy

# Skan bezpieczeństwa GitLab (joby lądują w stage `test`).
# UWAGA (audyt 2026-08 #5): joby analizatorów z tych szablonów są DOMYŚLNIE `allow_failure` —
# raportują znaleziska w MR/pipeline, ale go NIE blokują. To zachowanie szablonów GitLaba,
# zostawione świadomie (twarde blokowanie na SAST = pipeline czerwony od false-positives);
# w zamian raporty security w MR trzeba realnie przeglądać (docs/MAINTENANCE.md §8).
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Szablon jobów Node — obraz + cache pnpm + instalacja (frozen lockfile).
# UWAGA: NIE w `default`, bo joby SAST/Secret Detection mają własne obrazy (bez corepack)
# i dziedziczyłyby ten before_script → błąd. Kod-joby wciągają go przez `extends: .node`.
.node:
  image: node:24
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.5.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# Pipeline dla MR, `main` ORAZ pushy na gałęzie tematyczne (bez otwartego MR).
# ZAMKNIĘCIE audytu 2026-08 #5 („tylko 5 z 9 jobów blokuje, a gałęzie tematyczne w ogóle nie
# dostają pipeline'u"): właściciel autoryzował poniesienie kosztu minut runnerów, więc każdy push
# na gałąź uruchamia teraz bramki blokujące (sync:check · lint · typecheck · unit · build) —
# nie trzeba już czekać na otwarcie MR, by złapać regresję. Joby deploy/release/pages mają WŁASNE
# reguły (`$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH` [+ token przy release]), więc na gałęziach
# tematycznych się NIE odpalą. Joby doradcze (audit:deps, e2e) pozostają `allow_failure` — biegną,
# ale nie blokują.
workflow:
  rules:
    # Bez podwójnego pipeline'u: gdy gałąź ma już otwarty MR, pomiń pipeline „push" (MR-owy wystarcza).
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ── SYNC ─────────────────────────────────────────────────────────────────────
# Strażnicy synchronizacji (docs↔CHANGELOG, _ALL.sql↔schematy, .env.example↔env).
# Zero-dependency skrypty Node → bez instalacji, szybka bramka na wejściu.
sync:check:
  stage: sync
  image: node:24
  before_script: []
  script:
    - node scripts/check-docs-sync.mjs
    - node scripts/check-schema-sync.mjs
    - node scripts/check-env-sync.mjs

# ── QUALITY ──────────────────────────────────────────────────────────────────
lint:
  extends: .node
  stage: quality
  script:
    - pnpm exec biome ci dashboard web bot ingest scripts

typecheck:
  extends: .node
  stage: quality
  script:
    - pnpm --filter bot-dc-dashboard exec tsc --noEmit
    - pnpm --filter bot-dc-web exec tsc --noEmit
    - pnpm --filter bot-dc-bot exec tsc --noEmit
    - pnpm --filter bot-dc-ingest exec tsc --noEmit

audit:deps:
  extends: .node
  stage: quality
  script:
    - pnpm audit --audit-level moderate
  # informacyjnie — nie blokuje pipeline. Świadomie (audyt 2026-08 #5): świeży CVE w zależności
  # nie może wstrzymywać niezwiązanych MR-ów; podatności domyka Renovate (`vulnerabilityAlerts`
  # w renovate.json, osobne MR z etykietą „bezpieczeństwo") + przegląd tego raportu w MR.
  allow_failure: true

# ── TEST ─────────────────────────────────────────────────────────────────────
unit:
  extends: .node
  stage: test
  script:
    - pnpm exec vitest run --coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

build:
  extends: .node
  stage: test
  script:
    - pnpm --filter bot-dc-dashboard build
    - pnpm --filter bot-dc-web build

e2e:
  extends: .node
  stage: test
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm exec playwright test
  allow_failure: true # E2E wymaga serwera panelu — do promocji na wymagany po stabilizacji w CI
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 1 week

# ── RELEASE ──────────────────────────────────────────────────────────────────
# semantic-release: liczy wersję z Conventional Commits → tag vX.Y.Z, wpis w CHANGELOG,
# bump markerów SYNC (scripts/bump-sync-markers.mjs) i GitLab Release.
# BRAMKA BEZPIECZEŃSTWA: uruchamiany TYLKO RĘCZNIE (when: manual) i tylko gdy ustawiono
# zmienną CI/CD `GL_RELEASE_TOKEN` (Project Access Token: scope `api` + `write_repository`,
# rola Maintainer — by móc pushować na chronioną `main`). Bez tokena job się nie pojawia.
release:
  extends: .node
  stage: release
  variables:
    GITLAB_TOKEN: $GL_RELEASE_TOKEN
    GIT_DEPTH: 0 # semantic-release potrzebuje pełnej historii + tagów
  script:
    - npx semantic-release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GL_RELEASE_TOKEN'
      when: manual
      allow_failure: true

# ── DEPLOY ───────────────────────────────────────────────────────────────────
# Publikacja dokumentacji na GitLab Pages (MkDocs Material).
# URL: https://e-bot-f6d472.gitlab.io
pages:
  stage: deploy
  image: python:3.12-slim
  cache:
    key: mkdocs-pip
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - pip install --disable-pip-version-check -r requirements.txt
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
